<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Diario de películas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/peliculas.css">
    <link rel="stylesheet" href="css/libros.css">
    <link rel="stylesheet" href="css/movie.css">
    <link rel="stylesheet" href="css/tracks.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Lenis -->
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>
<body>

<!-- Header -->
<div id="header"></div>

<a href="javascript:history.back()" class="row-up scrollBtn">
    <i class="fa-solid fa-angle-left"></i>
</a>

<section class="section">
    <div class="container">
        <div class="movie-details-layout">
            <div class="movie-details-cover">
                <img id="movie-poster" src="" alt="" />
            </div>
            <div class="movie-details-text">
                <div>
                    <h3 class="section_title movie-details-title" id="movie-title"></h3>
                    <p class="slogan" id="movie-slogan"></p>
                    <p class="movie-description" id="movie-description"></p>
                </div>    
                <div class="movie-details-info">
                    <div class="imdb-rating">
                        <p>IMDb</p>
                        <p class="details-rating" id="imdb-rating"></p>
                    </div>
                    <div class="critics-rating" id="critics-box">
                        <p>Críticos</p>
                        <p class="details-rating" id="critics-rating"></p>
                    </div>
                    <div class="detail-genres">
                        <div class="genres-row" id="main-genres"></div>
                        <div class="genres-row" id="secondary-genres"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="section" id="fotogramas" style="display: none;">
    <div class="container">
        <h3 class="section_title">Fotogramas</h3>
        <div class="screenshots-container" id="screenshots-container"></div>
    </div>
</section>

<div id="modal" class="modal">
    <div class="modal-container">
        <span class="close">&times;</span>
        <img class="modal-content" id="modal-img">
        <p id="modal-caption"></p>
        <div class="carousel" id="carousel"></div>
    </div>
</div>

<section class="section" id="trailer-section" style="display: none;">
    <div class="container" id="trailer">
        <h3 class="section_title">Tráiler</h3>
        <div class="trailer-player">
            <video id="trailer-video"></video>
            <div class="video-control">
                <input type="range" id="progress" value="0" min="0" max="100" step="any">
                <div class="controls">
                    <div class="control-btns">
                        <div id="play-btn">
                            <i class="fa-solid fa-play"></i>
                        </div>
                        <div class="volume-control">
                            <span id="volume-icon"><i class="fa-solid fa-volume-high"></i></span>
                            <input type="range" id="volume" value="1" min="0" max="1" step="any">
                        </div>
                    </div>
                    <div id="fullscreen-btn" class="fullscreen-btn">
                        <i class="fa-solid fa-expand"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="section" id="related-section" style="display: none;">
    <div class="container">
        <h3 class="section_title">Contenido relacionado</h3>
        <div class="inner_section inner_book_section" id="related-container"></div>
    </div> 
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p class="copyright">@Mute Shadow</p>
    </div>
</footer>

<!-- STATIC PAGES -->
<script src="js/static-pages-script.js"></script>

<!-- GSAP (Parallax) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- COLOR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

<!-- DATA -->
<script src="js/data/content.js"></script>
<script src="js/data/genres.js"></script>
<!-- JS -->
<script src="js/script.js"></script>
<script src="js/movie.js"></script>

</body>
</html>
