<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Diario de películas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/error.css">
    
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/mobile.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Lenis -->
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>
<body>

<!-- Header -->
<header id="header"></header>

<div class="error error-login" data-active-form="login">
    <div class="container">
        <div class="error_content">
            <h1 class="error_title section_title" id="form-title">Iniciar sesión</h1>
            
            <!-- Login -->
            <form id="login-form">
                <div class="login-group">
                    <label>Correo electrónico / Usuario</label>
                    <input type="text" id="login_or_email" placeholder="Correo electrónico / Usuario" required>
                </div>

                <div class="login-group password-wrapper">
                    <label>Contraseña</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Contraseña" required>
                        <span class="toggle-password" onclick="togglePassword('password', this)">
                            <i class="fa-regular fa-eye"></i>
                        </span>
                    </div>
                </div>
                
                <button class="btn login-btn" type="submit">Iniciar sesión</button>

                <div class="login-links">
                    <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
                    <a href="#" id="show-register">Registro</a>
                </div>
            </form>

            <!-- Registro -->
            <form id="register-form" style="display:none;">
                <div class="login-group">
                    <label for="login">Usuario</label>
                    <input type="text" id="reg-login" placeholder="Usuario" required>
                </div>

                <div class="login-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="Correo electrónico" required>
                </div>

                <div class="login-group password-wrapper">
                    <label>Contraseña</label>
                    <div class="password-field">
                        <input type="password" id="reg-password" placeholder="Contraseña" required>
                        <span class="toggle-password" onclick="togglePassword('reg-password', this)">
                            <i class="fa-regular fa-eye"></i>
                        </span>
                    </div>
                </div>

                <button class="btn login-btn" type="submit">Registrarse</button>

                <div class="login-links iniciar-login-links">
                    <a href="#" id="show-login">Iniciar sesión</a>
                </div>
            </form>
        </div>
    </div>

    <img src="assets/img/iniciar.png" alt="Personaje">
</div>

<!-- STATIC PAGES -->
<script src="js/static-pages-script.js"></script>

<!-- GSAP (Parallax) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<!-- JQUERY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- JS -->
<script src="js/script.js"></script>
<script src="users/script/auth.js"></script>

</body>
</html>
